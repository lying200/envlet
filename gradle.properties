# Modified for Envlet: independent plugin identity and IDEA 262 target.
pluginGroup = io.github.lying200.envlet

# Only the fallback for local builds; a release passes PLUGIN_VERSION and rewrites this line
# through .github/scripts/set-plugin-version.sh in the commit that cuts the changelog.
pluginVersion = 0.1.11-dev

pluginSinceBuild = 262.10968
platformVersion = 2026.2.3

# The IntelliJ Platform ships kotlin-stdlib. Bundling a second copy causes LinkageError
# when the plugin shares a classloader with other plugins.
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache=true
org.gradle.jvmargs = -Xmx2048m -XX:MaxMetaspaceSize=512m
